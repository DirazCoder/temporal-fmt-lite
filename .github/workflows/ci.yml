name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      # Node 20/22 have no native Temporal, so the library has nothing to
      # call into unless something provides it first. temporal-polyfill is
      # already a devDependency for local testing — reuse it here instead
      # of adding a second one. Node 24/26 exercise the real built-in.
      - name: Set up Temporal for pre-26 Node
        if: matrix.node < 26
        run: echo "NEEDS_POLYFILL=1" >> $GITHUB_ENV
        shell: bash

      - name: Run format/parse against the built output
        shell: bash
        run: |
          node --input-type=module -e "
          if (process.env.NEEDS_POLYFILL) {
            const { Temporal } = await import('temporal-polyfill');
            globalThis.Temporal = Temporal;
          }
          const { format, parse } = await import('./dist/index.js');

          const assertEqual = (actual, expected, label) => {
            if (actual !== expected) {
              throw new Error(label + ': expected ' + expected + ', got ' + actual);
            }
            console.log('ok - ' + label);
          };

          const date = Temporal.PlainDate.from('2026-08-04');
          assertEqual(format(date, 'yyyy-MM-dd'), '2026-08-04', 'basic date format');
          assertEqual(format(date, 'MMMM d, yyyy'), 'August 4, 2026', 'month name format');

          const dt = Temporal.PlainDateTime.from('2026-08-04T15:45:30');
          assertEqual(format(dt, \"MMM d, yyyy 'at' h:mm a\"), 'Aug 4, 2026 at 3:45 PM', 'datetime with literal text');

          const zdt = Temporal.ZonedDateTime.from('2026-08-04T15:45:30-04:00[America/New_York]');
          assertEqual(format(zdt, 'yyyy-MM-dd HH:mm zzz'), '2026-08-04 15:45 America/New_York', 'zoned datetime with tz name');

          const parsed = parse('yyyy-MM-dd HH:mm', '2026-08-04 15:45');
          if (!(parsed instanceof Temporal.PlainDateTime)) {
            throw new Error('parse did not return a PlainDateTime');
          }
          console.log('ok - parse returns PlainDateTime');

          let threw = false;
          try { parse('yyyy-MM-dd', '2026-02-30'); } catch { threw = true; }
          if (!threw) throw new Error('parse accepted Feb 30, should have thrown');
          console.log('ok - parse rejects invalid calendar date');

          threw = false;
          try { parse('EEEE, yyyy-MM-dd', 'Monday, 2026-08-04'); } catch { threw = true; }
          if (!threw) throw new Error('parse accepted mismatched weekday, should have thrown');
          console.log('ok - parse rejects weekday/date mismatch');

          assertEqual(format(date, 'MMMM d, yyyy', { locale: 'fr-FR' }), 'août 4, 2026', 'fr-FR locale format');
          assertEqual(format(dt, 'h:mm a', { locale: 'ja-JP' }), '3:45 午後', 'ja-JP locale format');

          const roundTrip = parse('MMMM d, yyyy', 'août 4, 2026', { locale: 'fr-FR' });
          assertEqual(roundTrip.toString(), date.toString(), 'fr-FR round trip');

          console.log('all commands passed');
          "
